name: Publish Docs

on:
  push:
    branches:
    - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # to update the retype branch

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

      - name: Build with Retype
        uses: retypeapp/action-build@511f266c5de1ef96182ff88847e6169b906f50a2 # latest
        id: retype
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        with:
          config: docs/retype.yaml
          license: ${{ secrets.RETYPE_API_KEY }}

      - uses: retypeapp/action-github-pages@3edd31262123a286b401eb65557e5770b1880430 # latest
        with:
          update-branch: true
